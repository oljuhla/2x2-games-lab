<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2×2 Games Lab (local)</title>
<!-- Theme tokens the dashboard runtime normally provides. Values are approximations. -->
<style>
:root {
  --font-anthropic-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-anthropic-serif: Georgia, "Times New Roman", serif;
  --color-bg: #ffffff; --color-panel: #f7f7f5; --color-fg: #1f1f1d; --color-fg-muted: #6b6a66;
  --color-border-line: #dedcd6; --color-bad: #c9392c;
  --cds-surface-popover: #ffffff; --cds-border: #d8d6d0; --cds-text-secondary: #6b6a66;
  --cds-shadow-popover: 0 6px 20px rgba(0,0,0,.12); --cds-chart-grid: #e8e6e1;
  --cds-radius: 8px; --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 16px; --cds-gap-lg: 24px;
  --cds-pad-xs: 4px; --cds-pad-sm: 8px; --cds-pad-md: 12px; --cds-pad-lg: 20px;
  --cds-font-size-caption: 12.5px; --cds-font-size-body: 14px; --cds-font-size-heading: 16px; --cds-font-size-title: 26px;
  --cds-font-weight-medium: 600; --cds-dur-slow: 240ms;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-bg: #1d1d1b; --color-panel: #262624; --color-fg: #ecebe6; --color-fg-muted: #a3a29c;
    --color-border-line: #3a3a37; --cds-surface-popover: #2b2b29; --cds-border: #44443f; --cds-text-secondary: #a3a29c;
    --cds-chart-grid: #34342f; color-scheme: dark;
  }
}
html, body { margin: 0; background: var(--color-bg); color: var(--color-fg); }
body { padding: 24px; }
.dash-skeleton { background: linear-gradient(90deg, var(--color-panel), var(--color-border-line), var(--color-panel)); background-size: 200% 100%; animation: sk 1.2s linear infinite; border-radius: var(--cds-radius); }
@keyframes sk { to { background-position: -200% 0; } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="dash-shim.js"></script>
</head>
<body>
<div id="dash-root"></div>
<script>
// Load the page fragment exactly as published (style + markup + script), then run its scripts in order.
fetch('index.html').then((r) => r.text()).then((html) => {
  const tpl = document.createElement('template'); tpl.innerHTML = html;
  const root = document.getElementById('dash-root');
  [...tpl.content.childNodes].forEach((node) => {
    if (node.nodeName === 'SCRIPT') {
      const s = document.createElement('script');
      [...node.attributes].forEach((a) => s.setAttribute(a.name, a.value));
      s.textContent = node.textContent; root.append(s);
    } else root.append(node);
  });
}).catch((err) => { document.body.textContent = 'Serve this folder over http (see AGENTS.md): ' + err; });
</script>
</body>
</html>
